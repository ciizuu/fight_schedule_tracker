<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout idea: a fight-night bill. One column of weekends; each event is a row with
   the bell time on the left, the bout in the middle, the channel on the right. */
:root {
  --bg: #eceef1;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #5b6370;
  --line: #d5d9df;
  --accent: #c4122f;       /* boxing red, also the page accent */
  --ufc: #1f4fa8;          /* UFC blue */
  --warn-bg: #fff1cc;
  --warn-ink: #6b4a00;
  --live: #0d8a4a;
  --tag-bg: 70% 91%;       /* saturation + lightness for tag pills; hue comes from the tag name */
  --tag-ink: 60% 26%;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216;
    --surface: #181c22;
    --ink: #eef0f3;
    --muted: #9aa3b0;
    --line: #2b313a;
    --accent: #ff4d67;
    --ufc: #6f9cf0;
    --warn-bg: #3a2f10;
    --warn-ink: #f3d68a;
    --live: #3fd08a;
    --tag-bg: 35% 24%;
    --tag-ink: 75% 84%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216;
  --surface: #181c22;
  --ink: #eef0f3;
  --muted: #9aa3b0;
  --line: #2b313a;
  --accent: #ff4d67;
  --ufc: #6f9cf0;
  --warn-bg: #3a2f10;
  --warn-ink: #f3d68a;
  --live: #3fd08a;
  --tag-bg: 35% 24%;
  --tag-ink: 75% 84%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 56px; display: flex; flex-direction: column; gap: 22px; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; border-bottom: 3px solid var(--ink); padding-bottom: 14px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: .95; letter-spacing: .01em; text-transform: uppercase; margin: 0; }
h1 span { color: var(--accent); }
.tagline { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: 600 14px var(--font-body); color: var(--muted); background: none; border: 0; padding: 8px 16px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.right-controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 14px; color: var(--muted); }
.right-controls label { display: inline-flex; align-items: center; gap: 6px; }
select { font: 500 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; max-width: 100%; }
button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.next { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: baseline; justify-content: space-between; }
.next .lbl { font: 600 12px var(--font-body); letter-spacing: .1em; text-transform: uppercase; opacity: .7; display: block; }
.next .name { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.05; text-transform: uppercase; }
.next .count { font-family: var(--font-display); font-weight: 600; font-size: 26px; font-variant-numeric: tabular-nums; white-space: nowrap; }

section.wk { display: flex; flex-direction: column; gap: 10px; }
.wk-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.wk-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; text-transform: uppercase; margin: 0; line-height: 1; }
.wk-head .range { color: var(--muted); font-size: 15px; }
.wk-head .n { margin-left: auto; color: var(--muted); font-size: 14px; }
.day { font: 600 13px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }

.ev { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: 112px minmax(0, 1fr) minmax(120px, 170px); gap: 6px 18px; align-items: start; }
.ev[data-sport="ufc"] { border-left-color: var(--ufc); }
.ev-time .t { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; display: block; white-space: nowrap; }
.ev-time .tl { font-size: 13px; color: var(--muted); display: block; margin-top: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chip { font: 600 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; color: var(--surface); background: var(--accent); }
.chip.ufc { background: var(--ufc); }
.chip.flag { background: var(--warn-bg); color: var(--warn-ink); }
.chip.live { background: var(--live); }
.chip.mid { background: none; color: var(--muted); border: 1px solid var(--line); }
.ev h3 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.08; margin: 0; text-wrap: balance; }
.ev .bout, .ev .venue, .ev .note { margin: 3px 0 0; font-size: 14.5px; }
.ev .venue, .ev .note { color: var(--muted); }
.segs { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; font-variant-numeric: tabular-nums; }
.segs b { font-weight: 600; }
.segs span { color: var(--muted); }
.ev-watch .lbl { font: 600 11px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.ev-watch ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.ev-watch a { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.ev-watch a:hover { color: var(--accent); }
.ev-watch small { display: block; color: var(--muted); font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag { font: 500 12.5px var(--font-body); padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: hsl(var(--h) var(--tag-bg)); color: hsl(var(--h) var(--tag-ink)); }
.rk { display: inline-block; font: 700 .68em var(--font-body); letter-spacing: .02em; line-height: 1.5; padding: 0 5px; margin-right: 5px; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 4px; vertical-align: .14em; }
.rk.champ { background: var(--accent); color: var(--surface); }
.ev[data-sport="ufc"] .rk { border-color: var(--ufc); color: var(--ufc); }
.ev[data-sport="ufc"] .rk.champ { background: var(--ufc); color: var(--surface); }
.ev.has-fights { cursor: pointer; }
.more { grid-column: 1 / -1; justify-self: start; margin-top: 6px; font: 600 13.5px var(--font-body); color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
.more:hover { border-color: var(--ink); }
.fights { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; display: flex; flex-direction: column; gap: 12px; cursor: default; }
.fights h4 { font: 600 12px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.fights ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.fights li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 15px; }
.fights li b { font-weight: 600; }
.fights li .d { color: var(--muted); font-size: 14px; }
.left-controls { display: flex; flex-wrap: wrap; gap: 10px; }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
.cal-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; text-transform: uppercase; margin: 0 auto 0 0; }
.cal-nav { display: flex; gap: 6px; }
.cal-nav button { font: 600 14px var(--font-body); color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.cal-nav button:hover { border-color: var(--ink); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { font: 600 11px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 4px 0; }
.cal-day { min-height: 88px; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 5px; background: var(--bg); display: flex; flex-direction: column; gap: 4px; text-align: left; font: inherit; color: inherit; }
.cal-day.out { visibility: hidden; }
button.cal-day { background: var(--surface); cursor: pointer; }
button.cal-day:hover { border-color: var(--ink); }
.cal-day.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-day .num { font: 600 13px var(--font-body); font-variant-numeric: tabular-nums; align-self: flex-start; padding: 0 5px; border-radius: 999px; }
.cal-day.today .num { background: var(--ink); color: var(--bg); }
.cal-evs { display: flex; flex-direction: column; gap: 2px; min-width: 0; width: 100%; }
.cal-ev { display: block; font: 500 11.5px/1.4 var(--font-body); padding: 1px 5px; border-radius: 3px; color: var(--surface); background: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-ev.ufc { background: var(--ufc); }
.cal-ev.done { opacity: .45; }
.cal-more { font-size: 11px; color: var(--muted); }
.cal-key { display: flex; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.cal-key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); margin-right: 5px; }
.cal-key i.ufc { background: var(--ufc); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 22px; color: var(--muted); text-align: center; }

footer { color: var(--muted); font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 14px; }
footer p { margin: 0 0 6px; max-width: 70ch; }
#problems { color: var(--warn-ink); background: var(--warn-bg); padding: 8px 10px; border-radius: 6px; }
footer a { color: inherit; }

@media (max-width: 640px) {
  h1 { font-size: 40px; }
  .ev { grid-template-columns: 1fr; }
  .ev-time { display: flex; align-items: baseline; gap: 8px; }
  .ev-time .tl { margin: 0; }
  .ev-watch ul { flex-direction: row; flex-wrap: wrap; gap: 4px 14px; }
  .wk-head .n { margin-left: 0; }
  .cal { padding: 8px; }
  .cal-day { min-height: 56px; align-items: center; padding: 4px 2px; }
  .cal-day .num { align-self: center; }
  .cal-evs { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 3px; }
  .cal-ev { width: 8px; height: 8px; padding: 0; border-radius: 50%; font-size: 0; }   /* cards become dots on a phone */
  .cal-more { display: none; }
}
</style>
</head>

<div class="wrap">

    <p id="problems" hidden></p>
    <p>Cards, times and broadcasters change, boxing especially. A yellow tag means the time isn't confirmed. Where to watch is for viewers in the United States.</p>
  </footer>
</div>

<script>
/* ============================================================
   SETUP — the only lines you ever need to change in this file.
   Paste your Google Sheet's "Publish to web" CSV link between the quotes.
   While it is empty, the page shows the sample schedule stored at the bottom of this file.
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSSCUzU8VO6KpAXclbbhwth1BVr0-G4kpYk78JptohSCK4FkJ3zE-RWMHXe4QPWJ47X2sW35jutZWxz/pub?gid=1865463693&single=true&output=csv";

/* OPTIONAL — rankings. Paste the "Publish to web" CSV link of your rankings tab here.
   That tab needs four columns: list (UFC or Ring), division, rank (C for champion, or a number), fighter.
   Leave it empty and the site simply shows no rank numbers. */
const RANKINGS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMoDTcUGj9igf3NBWQi-CIaX9GVFVaTV8k52e681wPT7z5EUSMMTRi8ACMBHS-Sz-n7ciWhLXbR2Tk/pub?gid=955372726&single=true&output=csv";

/* Broadcaster names the page turns into links. In the sheet's "watch" column, write names
   separated by commas. For one that isn't listed here, either add it below or write it in
   the sheet as:  Name | https://link  */
const BROADCASTERS = {
  "paramount+": "https://www.paramountplus.com/",
  "dazn": "https://www.dazn.com/",

/* ============================================================
   SHEET READING
   ============================================================ */
const ET = "America/New_York";

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  if (text.charCodeAt(0) === 65279) text = text.slice(1);   // strip the byte-order mark some exports add
  text = text.replace(/^\s+/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

// "2026-11-14" or "11/14/2026" -> [y, m, d]
function parseDate(s) {
  s = String(s || "").trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return [+m[1], +m[2], +m[3]];
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return [+m[3], +m[1], +m[2]];
  return null;
}
// "9:00 PM", "9pm", "21:00", "9:00:00 PM" -> [h, m]; blank or "TBA" -> null
function parseTime(s) {
  s = String(s || "").trim().toLowerCase();
  const m = s.match(/^(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*(a|p)?\.?m?\.?$/);
  if (!m) return null;
  let h = +m[1]; const mm = +(m[2] || 0);
  if (m[3] === "p" && h < 12) h += 12;
  if (m[3] === "a" && h === 12) h = 0;
  if (h > 23 || mm > 59 || (!m[3] && !m[2])) return null;
  return [h, mm];
}
// Clock time in US Eastern -> exact moment. Handles daylight saving on its own.
function zoneOffset(ts, tz) {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric" })
    .formatToParts(new Date(ts)).forEach(x => { p[x.type] = +x.value; });
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - ts;
}
function easternToDate(y, mo, d, h, mi) {
  const wall = Date.UTC(y, mo - 1, d, h, mi);
  let t = wall - zoneOffset(wall, ET);
  t = wall - zoneOffset(t, ET);
  return new Date(t);
}

function parseTags(s) {
  const seen = {}, out = [];
  String(s || "").split(",").map(t => t.trim()).filter(Boolean).forEach(t => { const k = t.toLowerCase(); if (!seen[k]) { seen[k] = 1; out.push(t); } });
  return out;
}
const norm = s => String(s || "").trim().toLowerCase();

// Names are compared loosely: capitals, accents and punctuation don't matter.
function normName(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/ł/g, "l").replace(/ø/g, "o").replace(/đ/g, "d")
    .replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}
let RANKS = {};
// Rankings rows -> lookup table. UFC cards use rows whose list is "UFC"; boxing cards use every other list (Ring).
function rowsToRanks(rows) {
  const map = {}, problems = [];
  if (!rows.length) return { map, problems };
  const head = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ""));
  const need = ["list", "rank", "fighter"].filter(n => head.indexOf(n) < 0);
  if (need.length) return { map, problems: ['The rankings tab has no "' + need.join('", "') + '" column in row 1.'] };
  rows.slice(1).forEach(r => {
    const get = name => { const c = head.indexOf(name); return c < 0 ? "" : String(r[c] || "").trim(); };
    const fighter = normName(get("fighter")), rank = get("rank").replace(/^#/, "").toUpperCase();
    if (!fighter || !rank) return;
    const key = (/ufc/i.test(get("list")) ? "ufc" : "boxing") + "|" + fighter;
    const p4p = /pound/i.test(get("division"));
    if (!map[key] || (map[key].p4p && !p4p)) map[key] = { rank, division: get("division"), list: get("list"), p4p };   // a division rank beats pound-for-pound
  });
  return { map, problems };
}
function rankOf(name, sport) { return RANKS[sport + "|" + normName(name)] || null; }

// Sheet rows -> events. Returns { events, problems } so bad rows are reported, not silently lost.
function rowsToEvents(rows) {
  const events = [], problems = [], fightRows = [];
  if (!rows.length) return { events, problems: ["The sheet is empty."] };
  const head = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ""));
  const col = name => head.indexOf(name);
  ["sport", "title", "date"].forEach(n => { if (col(n) < 0) problems.push('The sheet has no "' + n + '" column in row 1.'); });
  if (problems.length) return { events, problems };
  rows.slice(1).forEach((r, i) => {
    const get = name => { const c = col(name); return c < 0 ? "" : String(r[c] || "").trim(); };
    const title = get("title");
    const n = i + 2;
    // One description line built from whichever of these columns exist: details, weight_class, rounds
    const rounds = get("rounds");
    const about = [get("details"), get("weightclass") || get("weight"), /^\d+$/.test(rounds) ? rounds + (rounds === "1" ? " round" : " rounds") : rounds]
      .filter(Boolean).join(" · ");
    if (get("card")) {                                        // a single fight on someone's card
      if (!title) problems.push("Row " + n + " skipped: it names a card but has no fight in the title column.");
      else fightRows.push({ n, card: get("card"), title, details: about, section: get("section"), tags: parseTags(get("tags")) });
      return;
    }
    if (!title && !get("date")) return;                       // blank row
    const ymd = parseDate(get("date"));
    if (!title) { problems.push("Row " + n + " skipped: no title."); return; }
    if (!ymd) { problems.push("Row " + n + " (" + title + ") skipped: write the date as 2026-12-31 or 12/31/2026."); return; }
    const segments = []; let prev = null, dayShift = 0;
    for (let k = 1; k <= 3; k++) {
      const raw = get("time" + k + "et") || get("time" + k);
      if (!raw || /^tba$/i.test(raw)) continue;
      const hm = parseTime(raw);
      if (!hm) { problems.push("Row " + n + " (" + title + "): couldn't read the time \"" + raw + "\". Write it like 9:00 PM."); continue; }
      const mins = hm[0] * 60 + hm[1];
      if (prev !== null && mins < prev) dayShift++;            // e.g. main event after midnight
      prev = mins;
      segments.push({ label: get("label" + k) || (segments.length ? "Main event" : "Card starts"), at: easternToDate(ymd[0], ymd[1], ymd[2] + dayShift, hm[0], hm[1]) });
    }
    const wnote = get("watchnote");
    const watch = get("watch").split(",").map(s => s.trim()).filter(Boolean).map((w, j) => {
      const parts = w.split("|").map(s => s.trim());
      const url = /^https?:\/\//.test(parts[1] || "") ? parts[1] : (BROADCASTERS[parts[0].toLowerCase()] || "");
      return { name: parts[0], url, note: j === 0 ? wnote : "" };
    });
    if (!watch.length) watch.push({ name: "Not announced", url: "", note: wnote });
    events.push({
      sport: /ufc|mma/i.test(get("sport")) ? "ufc" : "boxing",
      title, bout: about, venue: get("venue"),
      date: ymd[0] + "-" + String(ymd[1]).padStart(2, "0") + "-" + String(ymd[2]).padStart(2, "0"),
      segments, watch, flag: get("flag"), note: get("note"),
      tags: parseTags(get("tags")), fights: []
    });
  });
  // Hang each fight on its card: exact title first, otherwise the one card whose title starts with it ("UFC 334").
  fightRows.forEach(f => {
    const want = norm(f.card);
    let hits = events.filter(e => norm(e.title) === want);
    if (!hits.length) hits = events.filter(e => norm(e.title).indexOf(want) === 0);
    if (hits.length === 1) hits[0].fights.push(f);
    else problems.push("Row " + f.n + " (" + f.title + "): " + (hits.length ? "more than one card starts with" : "no card is called") + " \"" + f.card + "\".");
  });
  events.forEach(e => {
    e.id = e.date + "|" + e.title;
    e.allTags = parseTags(e.tags.concat.apply(e.tags, e.fights.map(f => f.tags)).join(","));
  });
  return { events, problems };
}

let EVENTS = [];

/* ============================================================
   LOGIC
   ============================================================ */
const DAY_MS = 86400000;
const WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

function localZone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "America/New_York"; }
  catch (e) { return "America/New_York"; }
}

// Calendar date of an instant in a time zone, as a UTC-midnight Date (a "plain day").
function dayIn(date, tz) {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: tz, year: "numeric", month: "numeric", day: "numeric" })
    .formatToParts(date).forEach(x => { p[x.type] = x.value; });
  return new Date(Date.UTC(+p.year, +p.month - 1, +p.day));
}
function plainDay(str) { const a = str.split("-"); return new Date(Date.UTC(+a[0], +a[1] - 1, +a[2])); }
function monIndex(day) { return (day.getUTCDay() + 6) % 7; }            // Mon=0 … Sun=6
function fridayOf(day) { return new Date(day.getTime() + (4 - monIndex(day)) * DAY_MS); }
function fmtDay(day, opts) { return new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: "UTC" }, opts)).format(day); }
function fmtTime(date, tz) { return new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" }).format(date); }

// Turn a raw event into something the page can sort, group and draw.
function prepare(ev, tz) {
  const segs = (ev.segments || []).map(s => ({ label: s.label, at: new Date(s.at) })).sort((a, b) => a.at - b.at);
  const timed = segs.length > 0;
  const day = timed ? dayIn(segs[0].at, tz) : plainDay(ev.date);
  const start = timed ? segs[0].at : new Date(day.getTime() + 17 * 3600000); // untimed: sorts mid-day, counts as over next morning
  const end = timed ? new Date(segs[segs.length - 1].at.getTime() + 4 * 3600000) : new Date(day.getTime() + 36 * 3600000);
  return Object.assign({}, ev, { segs, timed, day, start, end, friday: fridayOf(day), midweek: monIndex(day) < 4 });
}

function buildGroups(events, tz, now, filter, showPast, tag) {
  const today = dayIn(now, tz);
  const thisFri = fridayOf(today).getTime();
  const list = events.map(e => prepare(e, tz))
    .filter(e => filter === "all" || e.sport === filter)
    .filter(e => showPast || e.end > now)
    .filter(e => !tag || e.allTags.some(t => norm(t) === norm(tag)))
    .sort((a, b) => a.day - b.day || (b.timed - a.timed) || a.start - b.start);   // by day, timed cards first, then by bell time
  const groups = [];
  list.forEach(e => {
    const key = e.friday.getTime();
    let g = groups.find(x => x.key === key);
    if (!g) {
      const weeks = Math.round((key - thisFri) / (7 * DAY_MS));
      g = { key, friday: e.friday, events: [],
            name: weeks === 0 ? "This weekend" : weeks === 1 ? "Next weekend" : weeks === -1 ? "Last weekend" : "Weekend of " + fmtDay(e.friday, { month: "short", day: "numeric" }) };
      groups.push(g);
    }
    g.events.push(e);
  });
  groups.sort((a, b) => a.key - b.key);
  return groups;
}

function rangeLabel(friday) {
  const sun = new Date(friday.getTime() + 2 * DAY_MS);
  const a = fmtDay(friday, { month: "short", day: "numeric" });
  const b = friday.getUTCMonth() === sun.getUTCMonth() ? fmtDay(sun, { day: "numeric" }) : fmtDay(sun, { month: "short", day: "numeric" });
  return "Fri " + a + " – Sun " + b;
}

function countdown(ms) {
  const m = Math.max(0, Math.floor(ms / 60000));
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  return (d ? d + "d " : "") + (d || h ? h + "h " : "") + mm + "m";
}

    document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter)));
    renderNext(now);
    // Tag menu: every tag used anywhere in the sheet
    const all = parseTags(EVENTS.map(e => e.allTags.join(",")).join(",")).sort((a, b) => a.localeCompare(b));
    if (state.tag && !all.some(t => norm(t) === norm(state.tag))) state.tag = "";
    const tagSel = document.getElementById("tag");
    document.getElementById("tag-wrap").hidden = !all.length;
    tagSel.innerHTML = '<option value="">Any</option>' + all.map(t => '<option value="' + esc(t) + '">' + esc(t) + "</option>").join("");
    tagSel.value = all.find(t => norm(t) === norm(state.tag)) || "";
    document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    document.getElementById("past-wrap").hidden = state.view === "cal";      // the calendar always shows finished cards, dimmed
    if (state.view === "cal") {
      const el = document.getElementById("list");
      el.innerHTML = calendarHTML(now);
      el.style.display = "flex"; el.style.flexDirection = "column"; el.style.gap = "26px";
      return;
    }
    const groups = buildGroups(EVENTS, state.tz, now, state.filter, state.past, state.tag);
    const list = document.getElementById("list");
    if (!groups.length) { list.innerHTML = '<p class="empty">Nothing on the schedule for this filter. Try All, or tick Show finished.</p>'; return; }
    list.innerHTML = groups.map(g => {
      let lastDay = null, body = "";
      g.events.forEach(e => {
        if (e.day.getTime() !== lastDay) {
          lastDay = e.day.getTime();
          body += '<p class="day">' + fmtDay(e.day, { weekday: "long", month: "short", day: "numeric" }) + "</p>";
        }
        body += eventHTML(e, now);
      });
      return '<section class="wk"><div class="wk-head"><h2>' + esc(g.name) + '</h2><span class="range">' + rangeLabel(g.friday) +
        '</span><span class="n">' + g.events.length + (g.events.length === 1 ? " card" : " cards") + "</span></div>" + body + "</section>";
    }).join("");
    list.style.display = "flex"; list.style.flexDirection = "column"; list.style.gap = "26px";
  }

  document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => { state.filter = b.dataset.filter; store.set("filter", state.filter); render(); }));
  document.getElementById("tag").addEventListener("change", ev => { state.tag = ev.target.value; store.set("tag", state.tag); render(); });
  // Click a card (or its button) to open the full fight list
  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { state.view = b.dataset.view; store.set("view", state.view); render(); }));
  document.getElementById("list").addEventListener("click", ev => {
    const nav = ev.target.closest("[data-cal]"), dayBtn = ev.target.closest("[data-day]");
    if (nav) {                                                   // calendar: previous / next / today
      const step = nav.dataset.cal;
      if (step === "today") state.month = null;
      else { const d = new Date(Date.UTC(state.month.y, state.month.m + (step === "next" ? 1 : -1), 1)); state.month = { y: d.getUTCFullYear(), m: d.getUTCMonth() }; }
      state.day = null;
      render();
      const again = document.querySelector('[data-cal="' + step + '"]'); if (again) again.focus();
      return;
    }
    if (dayBtn) {                                                // calendar: pick a day
      state.day = +dayBtn.dataset.day;
      render();
      const again = document.querySelector('[data-day="' + state.day + '"]'); if (again) again.focus();
      return;
    }
    const card = ev.target.closest(".ev.has-fights");
    if (!card || ev.target.closest("a") || (ev.target.closest(".fights"))) return;
    const id = card.dataset.id;
    if (open.has(id)) open.delete(id); else open.add(id);
    render();
    const again = Array.from(document.querySelectorAll(".ev.has-fights")).find(x => x.dataset.id === id);
    if (again) again.querySelector(".more").focus();
  });
  tzSel.addEventListener("change", () => { state.tz = tzSel.value; store.set("tz", state.tz); render(); });
  document.getElementById("past").addEventListener("change", ev => { state.past = ev.target.checked; store.set("past", state.past ? "1" : "0"); render(); });

  // ---- Load the schedule: Google Sheet -> last copy saved in this browser -> sample at the bottom of this file ----
  function use(csv, message, ranksCsv) {
    const out = rowsToEvents(parseCSV(csv));
    const rk = ranksCsv ? rowsToRanks(parseCSV(ranksCsv)) : { map: {}, problems: [] };
    EVENTS = out.events; RANKS = rk.map;
    const problems = out.problems.concat(rk.problems);
    document.getElementById("status").textContent = message;
    const pr = document.getElementById("problems");
    pr.hidden = !problems.length;
    pr.textContent = problems.length ? "Check the sheet: " + problems.join(" ") : "";
    render();
  }
  async function getCSV(url) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 12000);
    try {
      const res = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store", signal: ctl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const csv = await res.text();
      if (/^\s*</.test(csv)) throw new Error("that link returned a web page, not CSV");
      return csv;
    } catch (e) { throw new Error(e.name === "AbortError" ? "it took too long to answer" : e.message); }
    finally { clearTimeout(timer); }
  }
  const sample = document.getElementById("sample").textContent.trim();
  const sampleRanks = document.getElementById("sample-rankings").textContent.trim();
  async function load() {
    if (!SHEET_CSV_URL) { use(sample, "Showing the sample schedule. To use your own Google Sheet, paste its published CSV link into SHEET_CSV_URL at the top of this file's script.", sampleRanks); return; }
    let ranks = "", rankNote = "";
    if (RANKINGS_CSV_URL) {
      try { ranks = await getCSV(RANKINGS_CSV_URL); store.set("ranks", ranks); }
      catch (err) { ranks = store.get("ranks", ""); rankNote = " Couldn't reach the rankings tab (" + err.message + ")" + (ranks ? "; using the last copy this browser saved." : "; rank numbers are hidden."); }
    }
    try {
      const csv = await getCSV(SHEET_CSV_URL);
      store.set("csv", csv);
      use(csv, "Schedule loaded from the Google Sheet at " + fmtTime(new Date(), here) + "." + rankNote, ranks);
    } catch (err) {
      const saved = store.get("csv", "");
      if (saved) use(saved, "Couldn't reach the Google Sheet (" + err.message + "). Showing the last copy this browser saved." + rankNote, ranks);
      else use(sample, "Couldn't reach the Google Sheet (" + err.message + "). Showing the sample schedule instead. Check that the sheet is published to the web as CSV." + rankNote, ranks);
    }
  }
  load();
  setInterval(() => renderNext(new Date()), 30000);   // keep the countdown ticking
  setInterval(load, 5 * 60000);      // re-read the sheet every 5 minutes
})();

if (typeof module !== "undefined") module.exports = { parseCSV, rowsToEvents, rowsToRanks, normName, setRanks: m => { RANKS = m; }, rankOf, buildGroups, fmtTime, rangeLabel };
</script>
